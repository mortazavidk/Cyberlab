function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{alert('Local storage unavailable; export results before closing.')}}let game=load('northstar-v2-game',null),board=load('northstar-v2-board',[]),page='learn',lab=0,practice=defaults[0](),selected=0,report=null,drag=-1;
function idx(){return page==='learn'?lab:game.results.length}function state(){return page==='learn'?practice:game.draft}function persist(){if(page==='game')save('northstar-v2-game',game)}function change(k,v,j){let s=state();if(j===undefined)s[k]=v;else s[k][j]=v;report=null;persist();render()}function mark(k,j){let a=state()[k];change(k,a.includes(j)?a.filter(x=>x!==j):[...a,j])}function inspect(k,j){selected=j;let a=state()[k];if(!a.includes(j))a.push(j);persist();render()}function go(p){page=p;report=null;selected=0;render()}function total(g){return g.results.reduce((a,r)=>a+r.score,0)}function elapsed(){return Math.max(0,Math.floor(((game.end||Date.now())-game.start)/1000))}function time(s){return Math.floor(s/60)+'m '+s%60+'s'}
function evaluate(i,s){let a=[];const add=(label,ok,points)=>a.push({label,ok:!!ok,points});if(i===0){add('Web server inspected',s.seen.includes(2),30);add('Router inspected',s.seen.includes(1),20);s.ports.slice(1).forEach((v,j)=>add(['HTTP disabled','FTP disabled','SSH disabled'][j],!v,20));add('HTTPS remains available',s.ports[0],40)}if(i===1){incidents.forEach((r,j)=>{add('Incident '+(j+1)+' evidence reviewed',s.seen.includes(j),10);add('Threat '+(j+1)+' identified',s.kind[j]===r[1],10);add('CIA objective '+(j+1),s.cia[j]===r[2],5);add('Control '+(j+1),s.control[j]===r[3],12.5)})}if(i===2)flows.forEach((f,j)=>add(f[0]+' → '+f[1]+' '+f[2],s.allow[j]===f[3],20));if(i===3){s.place.forEach((v,j)=>add(devices[j]+' zone',v===[0,0,1,1,2,3][j],10));add('Cross-zone restrictions',s.restrict,60);add('Compromised device isolated',s.isolate,50);add('SIS database dependency maintained',s.dependency,30)}if(i===4){add('Access points inspected and rogue reported',s.seen.length===4&&s.rogue,30);add('Supported encryption',['WPA3','WPA2-AES'].includes(s.protocol),30);add('Strong credentials',s.strong,20);add('Administrator credentials changed',s.admin,15);add('Remote administration disabled',!s.remote,10);add('Firmware updated',s.patch,15);add('Guest network isolated',s.guest,30)}if(i===5){add('Suspicious evidence selected',JSON.stringify([...s.evidence].sort())==='[1,2,3]',30);add('Evidence timeline complete',[1,2,3].every(x=>s.evidence.includes(x)),30);add('Correct device identified',s.device==='Guest laptop',30);add('Suspicious device contained',s.contained&&s.device==='Guest laptop',40);add('SIS remains available',!s.contained||s.device!=='SIS server',20)}return a}
function score(i,s,h){return Math.max(0,evaluate(i,s).reduce((n,x)=>n+(x.ok?x.points:0),0)-(h?10:0))}function test(){report=evaluate(idx(),state());render()}function submit(){let i=idx();if(!report)return alert('Run the verification test first.');if(!confirm('Submit final configuration? This score is locked.'))return;game.results.push({state:structuredClone(state()),hint:!!game.hints[i],score:score(i,state(),game.hints[i])});game.draft=i<5?defaults[i+1]():null;if(i===5)game.end=Date.now();report=null;selected=0;persist();render()}
function btn(t,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function toggle(t,k,v,j){return `<label><input type="checkbox" ${v?'checked':''} onchange="change('${k}',this.checked${j===undefined?'':','+j})"> ${t}</label>`}function select(k,opts,v,j){return `<select aria-label="${k}" onchange="change('${k}',this.value${j===undefined?'':','+j})">${['',...opts].map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x||'Choose…')}</option>`).join('')}</select>`}
function node(x,y,t,icon,fn,color='#42c9ff'){return `<g class="node" tabindex="0" role="button" aria-label="${esc(t)}" onclick="${fn}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${fn}}"><rect x="${x-65}" y="${y-27}" width="130" height="54" rx="8" fill="#102b42" stroke="${color}" stroke-width="2"/><text x="${x}" y="${y-3}" text-anchor="middle" font-size="19">${icon}</text><text x="${x}" y="${y+16}" text-anchor="middle" fill="#e4efff" font-size="12">${esc(t)}</text></g>`}function wire(d,c='#42c9ff'){return `<path class="wire" d="${d}" style="stroke:${c}"/>`}function map(body){return `<div class="map"><svg viewBox="0 0 600 320" aria-label="Simulated network diagram">${body}</svg></div>`}
function task(i){let s=state();if(i===0){let names=['Internet','Router','Web server','Database','Staff PC'];let diagram=map(wire('M300 48V100 M300 150V180H100V245 M300 180V245 M300 180H500V245')+node(300,25,names[0],'☁','inspect(\'seen\',0)')+node(300,125,names[1],'▣','inspect(\'seen\',1)')+node(100,270,names[4],'▣','inspect(\'seen\',4)')+node(300,270,names[2],'▤','inspect(\'seen\',2)',selected===2?'#65efa2':'#42c9ff')+node(500,270,names[3],'▱','inspect(\'seen\',3)'));return `<div class="split">${diagram}<div class="panel"><h3>${names[selected]||names[0]}</h3>${selected===2?'<p>IP: 192.168.10.20. Business requirement: HTTPS only; administration is local in this exercise.</p>'+['HTTPS 443','HTTP 80','FTP 21','SSH 22'].map((t,j)=>toggle(t,'ports',s.ports[j],j)).join(''):selected===1?'<p>Router connects the campus LAN to the internet (network layer).</p>':'<p>Click the router and web server to inspect their roles and services.</p>'}<small>Application services use transport ports; IP addresses identify network interfaces.</small></div></div>`}if(i===1){let r=incidents[selected]||incidents[0],j=selected;return `<div class="row">${incidents.map((_,k)=>btn('Incident '+(k+1),`inspect('seen',${k})`,k===j?'active':'')).join('')}</div><div class="split">${map(wire('M125 110H475',s.control[j]===r[3]?'#65efa2':'#ff8490')+node(90,110,'Client','▣','void(0)')+node(510,110,'SIS server','▤','void(0)')+node(300,220,'Observed activity','⚠','inspect(\'seen\','+j+')','#ffd078')+wire('M300 110V193','#ffd078'))}<div class="panel"><h3>Evidence ${j+1}</h3><p>${r[0]}</p>${btn('Collect evidence',`inspect('seen',${j})`)}<label>Threat ${select('kind',incidents.map(x=>x[1]),s.kind[j],j)}</label><label>Primary CIA impact ${select('cia',['Confidentiality','Integrity','Availability'],s.cia[j],j)}</label><label>Apply control ${select('control',incidents.map(x=>x[3]),s.control[j],j)}</label></div></div>`}if(i===2)return `<div class="split">${map(wire('M130 90H300V160H470',s.allow[0]?'#65efa2':'#ff8490')+wire('M130 240H300V160H470',s.allow[1]?'#ff8490':'#64748b')+node(75,90,'Internet','☁','void(0)')+node(75,240,'Guest','▣','void(0)')+node(300,160,'Firewall','▦','void(0)','#ffd078')+node(525,90,'SIS','▤','void(0)')+node(525,240,'Database','▱','void(0)'))}<div class="panel"><h3>Business policy</h3><p>Internet and students need SIS HTTPS; guests need internet only; staff need HRIS; SIS needs its database; IT alone needs SSH. Deny other traffic.</p></div></div><div class="scroll"><table><tr><th>Source</th><th>Destination</th><th>Service</th><th>Allow traffic</th></tr>${flows.map((f,j)=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${toggle(s.allow[j]?'Allow':'Block','allow',s.allow[j],j)}</td></tr>`).join('')}</table></div><small>Unlisted traffic is denied by default in this simulation.</small>`;if(i===3)return `<p>Drag a device into a zone, or select it and click a zone. Restrict cross-zone traffic and isolate the infected guest laptop.</p><div class="split"><div class="panel"><h3>Devices</h3>${devices.map((d,j)=>`<button draggable="true" ondragstart="drag=${j};event.dataTransfer.setData('text/plain','${j}')" onclick="selected=${j};render()" class="chip ${selected===j?'selected':''}">${j===0?'⚠':'▣'} ${d}</button>`).join('')}</div><div class="zones">${zones.map((z,k)=>`<div class="zone" ondragover="event.preventDefault()" ondrop="event.preventDefault();place(${k},Number(event.dataTransfer.getData('text/plain')))"><button onclick="place(${k},selected)">${z}</button><div>${devices.filter((_,j)=>s.place[j]===k).map(d=>`<span class="chip">${d}</span>`).join('')}</div></div>`).join('')}</div></div>${toggle('Restrict unnecessary communication between zones','restrict',s.restrict)}${toggle('Allow SIS to reach its database','dependency',s.dependency)}${toggle('Isolate compromised guest laptop','isolate',s.isolate)}<p class="${s.isolate?'good':'warn'}">Simulated reachable vulnerable devices: ${s.isolate?1:s.restrict&&s.place[0]>=0?s.place.filter(v=>v===s.place[0]).length:6} / 6 (assumes reachable devices are vulnerable).</p>`;if(i===4){let names=['Library AP-01','Admin AP-02','Student AP-03','Free Campus Wi-Fi'];return `<div class="split"><div class="map"><div class="zones">${names.map((n,j)=>`<div class="zone"><button onclick="inspect('seen',${j})">◉ ${n}</button><p class="${j===3?'warn':'muted'}">${['WEP','WPA3','WPA2','Open'][j]}</p></div>`).join('')}</div><p>Authorized inventory: AP-01, AP-02, AP-03.</p><p>Selected: ${names[selected]}</p>${toggle('Report unauthorized Free Campus Wi-Fi to IT','rogue',s.rogue)}</div><div class="panel"><h3>Library router settings</h3><label>Security protocol ${select('protocol',['Open','WEP','WPA2-AES','WPA3'],s.protocol)}</label>${toggle('Strong wireless credentials','strong',s.strong)}${toggle('Change default administrator credentials','admin',s.admin)}${toggle('Isolate guest network','guest',s.guest)}${toggle('Enable unnecessary remote administration','remote',s.remote)}${toggle('Install firmware update','patch',s.patch)}</div></div>`}return `<div class="split">${map(wire('M300 60V125H100V230 M300 125V230 M300 125H500V230')+node(300,35,'Firewall','▦','void(0)')+node(100,255,'Guest laptop','▣',"change('device','Guest laptop')",s.device==='Guest laptop'?'#ffd078':'#42c9ff')+node(300,255,'Faculty PC','▣',"change('device','Faculty PC')")+node(500,255,'SIS server','▤',"change('device','SIS server')"))}<div class="panel"><h3>Incident response</h3><p>Investigate repeated internal access attempts and unusual outbound traffic. Select evidence below in chronological order.</p><label>Device to investigate ${select('device',['Guest laptop','Student laptop','Faculty PC','SIS server'],s.device)}</label>${toggle('Isolate selected device','contained',s.contained)}<p class="${s.contained&&s.device==='SIS server'?'bad':'good'}">SIS: ${s.contained&&s.device==='SIS server'?'Offline':'Online'}</p></div></div><div class="scroll"><table><tr><th>Evidence</th><th>Time</th><th>Source</th><th>Destination</th><th>Event</th></tr>${logs.map((r,j)=>`<tr><td><input aria-label="Select event ${j+1}" type="checkbox" ${s.evidence.includes(j)?'checked':''} onchange="mark('evidence',${j})"></td>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div><small>Blocked attempts alone do not prove compromise; investigate correlated evidence.</small>`}
function place(k,j){if(Number.isInteger(j)&&j>=0&&j<6)change('place',k,j)}
function render(){ $('topscore').textContent=game?`${game.team} · ${total(game)} / 1,000 pts`:'';if(page==='board')return renderBoard();if(page==='game'&&!game){app.innerHTML=`<div class="panel"><h1>Register your defense team</h1><p>Work together on one shared browser. Six missions, one scored submission each. Test and revise freely; hints cost 10 points.</p><label>Team name<input id="team" type="text" maxlength="80"></label><label>Members<input id="members" type="text" maxlength="300"></label>${btn('Start challenge','start()','primary')}</div>`;return}if(page==='game'&&game.results.length===6){app.innerHTML=`<div class="panel"><h1>Challenge complete</h1><h2 class="good">${total(game)} / 1,000</h2><p>${esc(game.team)} · ${time(elapsed())}</p>${game.results.map((r,i)=>`<p>${titles[i]}: ${r.score} / ${max[i]}</p>`).join('')}${btn('Export team result','exportTeam()','primary')} ${btn('Start new team','resetGame()')}</div>`;return}let i=idx();app.innerHTML=`<div class="layout"><aside class="panel side"><h3>${page==='learn'?'Learning labs':'Challenge progress'}</h3>${titles.slice(0,page==='learn'?5:6).map((t,j)=>`<button ${page==='game'?'disabled':''} class="${i===j?'active':''}" onclick="switchLab(${j})">${page==='game'&&j<i?'✓ ':''}${j+1}. ${t}</button>`).join('')}${page==='game'?`<p id="clock">${time(elapsed())}</p><div class="bar"><i style="width:${i/6*100}%"></i></div>${btn('Reset team','resetGame()')}`:''}</aside><section><div class="panel"><h2>${page==='learn'?'Lab':'Mission'} ${i+1}: ${titles[i]}</h2><p>${brief[i]}</p><small>${page==='learn'?'Guided practice · unlimited attempts':max[i]+' points · one final submission'}</small>${page==='learn'?`<p class="muted">Concept guide: ${hints[i]}</p>`:''}</div><div class="panel">${task(i)}</div><div class="panel row">${btn('Run verification test','test()','primary')}${page==='learn'?btn('Reset experiment','switchLab('+i+')'):btn('Hint (−10)','hint()')+`<button onclick="submit()" ${report?'':'disabled'}>Submit mission</button>`}</div>${page==='game'&&game.hints[i]?`<p class="warn">Hint: ${hints[i]}</p>`:''}${report?`<div class="result"><h3>Verification: ${score(i,state(),page==='game'&&game.hints[i])} / ${max[i]}</h3>${report.map(r=>`<div class="${r.ok?'good':'warn'}">${r.ok?'✓':'○'} ${esc(r.label)} — ${r.ok?'Passed':'Review'}</div>`).join('')}</div>`:''}</section></div>`}
function switchLab(i){if(page!=='learn')return;lab=i;practice=defaults[i]();selected=0;report=null;render()}function hint(){game.hints[idx()]=true;persist();render()}function start(){let team=$('team').value.trim(),members=$('members').value.trim();if(!team||!members)return alert('Enter team name and members.');game={id:crypto.randomUUID?.()||String(Date.now()),team,members,start:Date.now(),end:null,results:[],hints:{},draft:defaults[0]()};selected=0;report=null;persist();render()}function resetGame(){if(confirm('Erase this team session? Export completed results first.')){game=null;save('northstar-v2-game',null);render()}}
function download(n,c,t){let u=URL.createObjectURL(new Blob([c],{type:t})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportTeam(){download('northstar-'+game.team.replace(/[^\w-]/g,'_')+'.json',JSON.stringify({format:'northstar-week7-v2',id:game.id,team:game.team,members:game.members,seconds:elapsed(),results:game.results},null,2),'application/json')}
function validate(x){if(x?.format!=='northstar-week7-v2'||typeof x.id!=='string'||typeof x.team!=='string'||!x.team.trim()||x.team.length>80||typeof x.members!=='string'||x.members.length>300||!Number.isSafeInteger(x.seconds)||x.seconds<0||x.results?.length!==6)throw Error('Invalid V2 result');x.results=x.results.map((r,i)=>{let d=defaults[i]();if(typeof r.hint!=='boolean'||!r.state)throw Error('Invalid mission');for(let k in d){let v=r.state[k];if(Array.isArray(d[k])){if(!Array.isArray(v)||v.length>10|| (d[k].length&&v.length!==d[k].length)||v.some(a=>typeof a!==(d[k].length?typeof d[k][0]:'number')))throw Error('Invalid configuration')}else if(typeof v!==typeof d[k])throw Error('Invalid configuration')}return {state:r.state,hint:r.hint,score:score(i,r.state,r.hint)}});return x}function ranked(){return [...board].sort((a,b)=>total(b)-total(a)||a.seconds-b.seconds||a.team.localeCompare(b.team))}function renderBoard(){app.innerHTML=`<div class="panel"><h1>Instructor Leaderboard</h1><p>Import team JSON files collected through Teams or Brightspace. Results stay in this browser.</p><input type="file" id="files" multiple accept=".json"> ${btn('Import results','importFiles()','primary')} ${btn('Export CSV','csvExport()')} ${btn('Clear','clearBoard()')}<p id="status"></p></div><div class="panel scroll"><table><tr><th>Rank</th><th>Team</th><th>Members</th>${max.map((m,i)=>`<th>M${i+1}/${m}</th>`).join('')}<th>Total</th><th>Time</th><th></th></tr>${ranked().map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.team)}</td><td>${esc(r.members)}</td>${r.results.map(m=>`<td>${m.score}</td>`).join('')}<td class="good">${total(r)}</td><td>${time(r.seconds)}</td><td>${btn('Remove',`remove(${i})`)}</td></tr>`).join('')}</table></div>`}async function importFiles(){let msg=[];for(let f of $('files').files){try{if(f.size>100000)throw Error('File too large');let x=validate(JSON.parse(await f.text()));if(board.some(r=>r.id===x.id||r.team.toLowerCase()===x.team.toLowerCase()))throw Error('Duplicate team');board.push(x);msg.push(f.name+': imported')}catch(e){msg.push(f.name+': '+e.message)}}save('northstar-v2-board',board);renderBoard();$('status').textContent=msg.join(' | ')||'Choose files first.'}function remove(i){let id=ranked()[i].id;board=board.filter(x=>x.id!==id);save('northstar-v2-board',board);renderBoard()}function clearBoard(){if(confirm('Clear all results?')){board=[];save('northstar-v2-board',board);renderBoard()}}function csvExport(){let rows=[['Rank','Team','Members',...titles,'Total','Seconds'],...ranked().map((r,i)=>[i+1,r.team,r.members,...r.results.map(m=>m.score),total(r),r.seconds])];download('northstar-leaderboard.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/^\s*[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
