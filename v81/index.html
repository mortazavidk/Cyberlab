<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Network Security Playground</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#172b42;font:16px system-ui}header{background:#102b46;color:white;padding:25px max(20px,calc((100vw - 1100px)/2))}header h1{margin:5px 0;font-size:28px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button,select,input{font:inherit;padding:10px 14px;border:1px solid #b9c8d7;border-radius:7px}button{background:#17638a;color:white;cursor:pointer;border:0}button:hover{background:#104969}button:disabled{opacity:.45;cursor:default}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #d5e0ea;border-radius:12px;padding:22px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.muted{color:#52677c}.good{color:#08734c}.bad{color:#b52d35}label{display:block;margin:12px 0}input[type=text]{width:100%}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #d5e0ea}select{max-width:100%}.scroll{overflow:auto}.bar{height:12px;background:#dce6ee;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#16866d}h2,h3{margin-top:0}.tag{font-size:13px;color:#52677c}pre{white-space:pre-wrap;background:#edf2f7;padding:12px}button.secondary{background:#52677c}footer{text-align:center;padding:20px;color:#52677c}svg{width:100%;max-height:260px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.question{padding:12px 0;border-bottom:1px solid #e0e7ef}.question select{display:block;margin-top:8px;width:100%}</style><header><div>CPSC 301 · WEEK 7 · NORTHSTAR UNIVERSITY</div><h1>Network Security Playground</h1><div>Explore. Defend. Investigate.</div><nav><button onclick="show('learn')">Learning Mode</button><button onclick="show('game')">Challenge Mode</button><button onclick="show('board')">Leaderboard</button></nav></header><main id="app"></main><footer>Educational simulation · No real network traffic is generated.</footer><script>
const $=id=>document.getElementById(id), app=$('app'), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{alert('Browser storage unavailable. Export your results before closing.')}}
const q=(prompt,options,answer,why)=>({prompt,options,answer,why});
const missions=[
{title:'Discover the Attack Surface',max:150,brief:'The public SIS web server needs HTTPS only. Review its services and network layers.',qs:[q('Public HTTPS TCP 443','Keep public|Disable|Expose database',0,'HTTPS is required for SIS access.'),q('Public FTP TCP 21, unused','Keep public|Disable|Replace with HTTP',1,'Unused services increase exposure.'),q('SSH TCP 22, needed by IT only','Keep public|Restrict to IT network|Disable all administration',1,'Restrict management access.'),q('Open transport port belongs to which layer?','Application|Transport|Link',1,'TCP and UDP ports are transport endpoints.'),q('Forged source IP belongs primarily to which layer?','Network|Application|Physical',0,'IP addressing is a network-layer function.')]},
{title:'Investigate Network Threats',max:150,brief:'Review incident reports from the university and identify the threats.',qs:[q('Unencrypted credentials are observed in transit.','DDoS|Eavesdropping|Patching',1,'Interception threatens confidentiality.'),q('Thousands of distributed devices overwhelm SIS.','DDoS|Spoofing|Encryption',0,'Distributed traffic can exhaust availability.'),q('A forged network identity is detected.','Segmentation|Spoofing|Patching',1,'Spoofing impersonates a trusted identity.'),q('Malware moves from a compromised laptop to a server.','Lateral movement|TLS|Default deny',0,'Reachable systems may enable lateral movement.'),q('Primary CIA objective affected by DDoS?','Integrity|Confidentiality|Availability',2,'DDoS disrupts legitimate access.')]},
{title:'Defend the Network',max:200,brief:'Allow public SIS HTTPS, SIS-to-database TCP 3306 and IT-only SSH. Deny other traffic.',qs:[q('Internet → SIS · TCP 443','Allow|Deny',0,'Required public service.'),q('Guest → Database · TCP 3306','Allow|Deny',1,'Guest access is not required.'),q('SIS → Database · TCP 3306','Allow|Deny',0,'Required application dependency.'),q('Internet → Linux · TCP 22','Allow|Deny',1,'Public administration is unnecessary.'),q('IT network → Linux · TCP 22','Allow|Deny',0,'Authorized administration is required.')]},
{title:'Contain the Infection',max:200,brief:'A guest laptop is compromised. Separate trust zones and restrict communication.',qs:[q('Guest laptop placement','Database zone|Guest zone|Staff zone',1,'Untrusted devices need an isolated zone.'),q('Student records database placement','Guest zone|Public internet|Database zone',2,'Sensitive data needs a restricted zone.'),q('Guest → Staff traffic','Allow all|Deny by default',1,'Block unnecessary cross-zone paths.'),q('SIS → Database required service','Block all|Allow only required port|Allow all ports',1,'Maintain operations with least privilege.'),q('Control incoming traffic on an individual server','Host firewall|Open Wi-Fi|DNS only',0,'Host firewalls protect individual systems.')]},
{title:'Secure Wireless Access',max:150,brief:'The campus router uses WEP, default credentials and outdated firmware.',qs:[q('Choose wireless protection (all devices support WPA3).','WEP|Open|WPA3',2,'WPA3 is preferred when supported.'),q('Default router administrator credentials','Keep|Replace with strong unique credentials',1,'Defaults are predictable.'),q('Guest wireless access','Share staff network|Isolate guests',1,'Separation limits internal access.'),q('Firmware update available','Install supported update|Ignore',0,'Patching reduces known vulnerabilities.'),q('Unknown Office_Free SSID imitates verified Office network','Connect automatically|Verify with IT before connecting',1,'Similar names may indicate rogue access points.')]},
{title:'Respond to the Incident',max:150,brief:'Firewall log: 09:00 Student→SIS 443 ALLOW; 09:02 Guest→DB 3306 DENY; 09:03 Guest→Linux 22 DENY; 09:05 SIS→DB 3306 ALLOW.',qs:[q('Which pattern requires investigation?','Student HTTPS|Repeated guest attempts to internal services|SIS database connection',1,'Repeated denied attempts may indicate reconnaissance.'),q('Does a denied connection prove compromise?','Yes|No',1,'A denied attempt is not proof of compromise.'),q('Best next action','Delete logs|Review correlated logs and investigate guest device|Disable all university services',1,'Correlate evidence before responding.'),q('A firewall permits malicious HTTPS content. What helps?','Patching and endpoint security|Disable logging|Open more ports',0,'Filtering alone is insufficient.'),q('What should be monitored?','Only passwords|Firewall logs, traffic patterns and alerts|Nothing after patching',1,'Monitoring helps detect abnormal activity.')]}
];missions.forEach(m=>m.qs.forEach(x=>x.options=x.options.split('|')));
let game=load('northstar-game-v1',null), board=load('northstar-board-v1',[]), page='learn', lab=0;function show(p){page=p;({learn:learn,game:renderGame,board:renderBoard}[p])()}
function questionHTML(m,prefix){return m.qs.map((x,i)=>`<div class="question"><strong>${i+1}. ${esc(x.prompt)}</strong><select id="${prefix}${i}"><option value="">Choose a response</option>${x.options.map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join('')}</select></div>`).join('')}
function evaluate(m,prefix){return m.qs.map((x,i)=>$(prefix+i).value===''?-1:Number($(prefix+i).value))}function feedback(m,a){return m.qs.map((x,i)=>`<p class="${a[i]===x.answer?'good':'bad'}">${i+1}. ${a[i]===x.answer?'Correct':'Expected: '+esc(x.options[x.answer])} — ${esc(x.why)}</p>`).join('')}
const labs=['Network Explorer','Network Threat Simulator','Firewall Playground','Network Segmentation','Wireless Security'];
function learn(){app.innerHTML=`<h2>Learning Mode</h2><p>Experiment freely, then check your understanding.</p><div class="row">${labs.map((n,i)=>`<button class="${i===lab?'':'secondary'}" onclick="lab=${i};learn()">${i+1}. ${n}</button>`).join('')}</div><section class="card"><h2>${labs[lab]}</h2><div id="experiment"></div></section><section class="card"><h3>Knowledge check</h3>${questionHTML(missions[lab],'l')}<p><button onclick="$('learnFeedback').innerHTML=feedback(missions[lab],evaluate(missions[lab],'l'))">Check answers</button></p><div id="learnFeedback" aria-live="polite"></div></section>`;experiment()}
function experiment(){let e=$('experiment');if(lab===0){e.innerHTML='<p>Public SIS server: only HTTPS is required publicly. Toggle listening services; assume no firewall blocks them.</p>'+['HTTPS 443','HTTP 80','SSH 22','FTP 21','Database 3306'].map((s,i)=>`<label><input type="checkbox" checked id="port${i}" onchange="portCheck()"> ${s}</label>`).join('')+'<div id="expResult"></div>';portCheck()}if(lab===1){e.innerHTML='<p>Compare intercepted application data and availability under simulated threats.</p><label>Protocol <select id="proto" onchange="threatCheck()"><option>HTTP</option><option>HTTPS</option></select></label><label>Traffic <select id="traffic" onchange="threatCheck()"><option>Normal</option><option>Distributed overload</option></select></label><div id="expResult"></div>';threatCheck()}if(lab===2){e.innerHTML='<p>Create ordered rules. First matching rule wins; unmatched traffic is denied.</p><div class="row"><select id="src"><option>Internet</option><option>Guest</option><option>SIS</option><option>IT</option></select><select id="dst"><option>SIS</option><option>Database</option><option>Linux</option></select><select id="svc"><option>443</option><option>3306</option><option>22</option></select><select id="act"><option>Allow</option><option>Deny</option></select><button onclick="addRule()">Add rule</button><button onclick="testRule()">Test traffic</button></div><div id="ruleList"></div><div id="expResult"></div>';rules=[];drawRules()}if(lab===3){e.innerHTML='<p>Assume all four devices are vulnerable to the simulated malware. Compare unrestricted and isolated guest access.</p><label><input type="checkbox" id="seg" onchange="segCheck()"> Isolate guest zone with firewall</label><button onclick="infect=true;segCheck()">Simulate infection</button> <button class="secondary" onclick="infect=false;segCheck()">Reset</button><div id="expResult"></div>';infect=false;segCheck()}if(lab===4){e.innerHTML='<label>Wi-Fi protocol <select id="wifi" onchange="wifiCheck()"><option>Open</option><option>WEP</option><option>WPA2-AES</option><option>WPA3</option></select></label>'+['Strong credentials','Isolated guest network','Changed admin credentials','Disable unnecessary remote administration','Updated firmware'].map((s,i)=>`<label><input type="checkbox" id="w${i}" onchange="wifiCheck()"> ${s}</label>`).join('')+'<div id="expResult"></div>';wifiCheck()}}
function portCheck(){let n=Array.from({length:5},(_,i)=>$('port'+i).checked).filter(Boolean).length;$('expResult').innerHTML=`<h3>${n} exposed services</h3><div class="bar"><div style="width:${n*20}%"></div></div><p>${!$('port0').checked?'Required HTTPS is unavailable.':n===1?'Only required HTTPS remains exposed.':'Unnecessary services remain exposed.'}</p>`}function threatCheck(){$('expResult').innerHTML=`<pre>${$('proto').value==='HTTP'?'Observed: username=demo; password=example':'Observed: encrypted application data (simulated)'}</pre><p>Availability: ${$('traffic').value==='Normal'?'Normal':'Degraded by simulated DDoS'}.</p><p>TLS protects data in transit, not service capacity.</p>`}let rules=[],infect=false;function tuple(){return ['src','dst','svc'].map(x=>$(x).value)}function addRule(){rules.push([...tuple(),$('act').value]);drawRules()}function drawRules(){$('ruleList').innerHTML=rules.map((r,i)=>`<p>${i+1}. ${r.join(' → ')} <button class="secondary" onclick="rules.splice(${i},1);drawRules()">Remove</button></p>`).join('')+'<p>Default: deny</p>'}function testRule(){let t=tuple(),r=rules.find(r=>t.every((v,i)=>r[i]===v));$('expResult').textContent=t.join(' → ')+' : '+(r?r[3]:'Deny (default)')}function segCheck(){let s=$('seg').checked;$('expResult').innerHTML=`<div class="grid">${['Guest laptop','Staff PC','SIS server','Database'].map((n,i)=>`<div class="card"><strong>${n}</strong><p class="${infect&&(!s||i===0)?'bad':'good'}">${infect&&(!s||i===0)?'Compromised':'Unaffected'}</p><small>${s?'Separate zone':'Shared network'}</small></div>`).join('')}</div><p>${infect?(s?'1 of 4 compromised in this model.':'4 of 4 compromised in this model.'):'Ready to simulate.'}</p>`}function wifiCheck(){let n=Number(['WPA2-AES','WPA3'].includes($('wifi').value))+Array.from({length:5},(_,i)=>$('w'+i).checked).filter(Boolean).length;$('expResult').innerHTML=`<h3>${n}/6 baseline controls satisfied</h3><div class="bar"><div style="width:${n/6*100}%"></div></div>`}
function persist(){save('northstar-game-v1',game)}function elapsed(){return Math.max(0,Math.floor(((game.end||Date.now())-game.start)/1000))}function duration(s){return Math.floor(s/60)+'m '+s%60+'s'}function total(g){return g.results.reduce((a,r)=>a+r.score,0)}function renderGame(){if(!game){app.innerHTML='<h2>Challenge Mode</h2><section class="card"><h3>Register your team</h3><p>Complete six missions together. Each mission permits one scored submission. A hint costs 10 points. Time breaks ties; no time penalty.</p><label>Team name<input id="team" type="text" maxlength="80"></label><label>Members (comma separated)<input id="members" type="text" maxlength="300"></label><button onclick="startGame()">Start challenge</button></section>';return}let i=game.results.length,m=missions[i];app.innerHTML=`<h2>Operation: Secure Northstar</h2><div class="card"><h3>${esc(game.team)}</h3><p>${esc(game.members)}</p><div class="grid"><div><small>Team score</small><h2>${total(game)} / 1000</h2></div><div><small>Missions completed</small><h2>${i} / 6</h2></div><div><small>Elapsed time</small><h2 id="clock">${duration(elapsed())}</h2></div></div><div class="bar"><div style="width:${i/6*100}%"></div></div></div><div class="card">${missions.map((x,j)=>`<p>${j+1}. ${x.title} — ${j<i?game.results[j].score+'/'+x.max:j===i?'Active':'Locked'}</p>`).join('')}</div>`;if(m){app.innerHTML+=`<section class="card"><h2>Mission ${i+1}: ${m.title}</h2><p>${m.brief}</p><p>Maximum ${m.max} points</p>${questionHTML(m,'g')}<p><button class="secondary" onclick="hint()" ${game.hints[i]?'disabled':''}>Request hint (−10)</button> <button onclick="submitMission()">Submit team decisions</button></p><div id="hintText">${game.hints[i]?esc(m.qs[0].why):''}</div></section>`;m.qs.forEach((_,j)=>{let el=$('g'+j);el.value=game.draft?.[j]??'';el.onchange=()=>{game.draft=m.qs.map((_,k)=>$('g'+k).value);persist()}})}else{app.innerHTML+='<section class="card"><h2>Challenge completed</h2><p>Export your team result and send it to your instructor for leaderboard import.</p><button onclick="exportTeam()">Export Team Result (JSON)</button> <button onclick="print()" class="secondary">Print report</button></section>'}if(i){let last=game.results[i-1];app.innerHTML+=`<section class="card"><h3>Previous mission feedback</h3>${feedback(missions[i-1],last.answers)}<p>Hint penalty: ${last.hint?10:0}</p></section>`}app.innerHTML+='<button class="secondary" onclick="if(confirm(\'Erase current team progress? Export completed results first.\')){game=null;persist();renderGame()}">Start a new team / reset</button>'}
function startGame(){let team=$('team').value.trim(),members=$('members').value.trim();if(!team||!members){alert('Enter team name and members.');return}game={version:1,id:globalThis.crypto?.randomUUID?.()||String(Date.now())+'-'+Math.random(),team,members,start:Date.now(),end:null,results:[],hints:{},draft:[]};persist();renderGame()}function hint(){let i=game.results.length;if(game.hints[i])return;game.hints[i]=true;persist();$('hintText').textContent=missions[i].qs[0].why;document.querySelector('button[onclick="hint()"]').disabled=true}function score(m,a,h){return Math.max(0,a.reduce((n,v,i)=>n+(v===m.qs[i].answer?m.max/m.qs.length:0),0)-(h?10:0))}function submitMission(){let i=game.results.length,m=missions[i],a=evaluate(m,'g');if(a.includes(-1)){alert('Answer all questions before submitting.');return}if(!confirm('Submit this mission? Scored answers cannot be changed.'))return;let h=!!game.hints[i];game.results.push({answers:a,hint:h,score:score(m,a,h)});game.draft=[];if(game.results.length===6)game.end=Date.now();persist();renderGame()}function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportTeam(){if(game.results.length!==6)return;download('northstar-'+game.team.replace(/[^a-z0-9_-]/gi,'_')+'.json',JSON.stringify({format:'northstar-week7-v1',id:game.id,team:game.team,members:game.members,seconds:elapsed(),results:game.results},null,2),'application/json')}
function validate(x){if(!x||x.format!=='northstar-week7-v1'||typeof x.id!=='string'||typeof x.team!=='string'||!x.team.trim()||x.team.length>80||typeof x.members!=='string'||x.members.length>300||!Number.isSafeInteger(x.seconds)||x.seconds<0||!Array.isArray(x.results)||x.results.length!==6)throw Error('Invalid result format');let results=x.results.map((r,i)=>{let m=missions[i];if(!r||typeof r.hint!=='boolean'||!Array.isArray(r.answers)||r.answers.length!==m.qs.length||!r.answers.every((v,j)=>Number.isInteger(v)&&v>=0&&v<m.qs[j].options.length))throw Error('Invalid mission answers');return {answers:r.answers,hint:r.hint,score:score(m,r.answers,r.hint)}});return {id:x.id,team:x.team,members:x.members,seconds:x.seconds,results}}
function ranked(){return [...board].sort((a,b)=>total(b)-total(a)||a.seconds-b.seconds||a.team.localeCompare(b.team))}function renderBoard(){app.innerHTML=`<h2>Instructor Leaderboard</h2><section class="card"><p>Import completed team JSON files from Teams or Brightspace. Scores are recalculated from submitted answers. Results remain in this browser only.</p><label>Upload team results <input type="file" id="files" multiple accept=".json,application/json"></label><button onclick="importFiles()">Import results</button> <button onclick="exportCSV()" class="secondary">Export CSV</button> <button class="secondary" onclick="if(confirm('Clear all imported results?')){board=[];save('northstar-board-v1',board);renderBoard()}">Clear leaderboard</button><p id="importStatus" aria-live="polite"></p></section><section class="card scroll"><h3>${board.length} teams</h3><table><thead><tr><th>Rank</th><th>Team</th><th>Members</th>${missions.map((m,i)=>`<th>M${i+1}<br>/${m.max}</th>`).join('')}<th>Total</th><th>Time</th><th></th></tr></thead><tbody>${ranked().map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.team)}</td><td>${esc(r.members)}</td>${r.results.map(m=>`<td>${m.score}</td>`).join('')}<td><strong>${total(r)}</strong></td><td>${duration(r.seconds)}</td><td><button class="secondary" onclick="removeTeam(${i})">Remove</button></td></tr>`).join('')}</tbody></table></section>`}function removeTeam(i){let r=ranked()[i];if(confirm('Remove '+r.team+'?')){board=board.filter(x=>x.id!==r.id);save('northstar-board-v1',board);renderBoard()}}async function importFiles(){let files=[...$('files').files],messages=[];for(let f of files){try{if(f.size>100000)throw Error('File too large');let r=validate(JSON.parse(await f.text()));if(board.some(x=>x.id===r.id||x.team.toLowerCase()===r.team.toLowerCase()))throw Error('Duplicate team or session; remove existing entry to replace');board.push(r);messages.push(f.name+': imported')}catch(e){messages.push(f.name+': '+e.message)}}save('northstar-board-v1',board);renderBoard();$('importStatus').textContent=messages.join(' | ')||'Choose at least one file.'}function csv(v){let s=String(v);if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}function exportCSV(){let rows=[['Rank','Team','Members',...missions.map((_,i)=>'Mission '+(i+1)),'Total','Seconds'],...ranked().map((r,i)=>[i+1,r.team,r.members,...r.results.map(x=>x.score),total(r),r.seconds])];download('northstar-leaderboard.csv',rows.map(r=>r.map(csv).join(',')).join('\r\n'),'text/csv;charset=utf-8')}setInterval(()=>{if(page==='game'&&game&&$('clock'))$('clock').textContent=duration(elapsed())},1000);show('learn');</script></html>
